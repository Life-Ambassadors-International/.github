name: Klthara Node — Unified Sovereign Workflow

on:
  push:
    branches: ['**']
    paths:
      - 'klthara_node/**'
      - '.github/workflows/klthara-node.yml'
      - 'requirements.txt'
  pull_request:
    branches: ['**']
    paths:
      - 'klthara_node/**'
      - '.github/workflows/klthara-node.yml'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage group to run'
        required: false
        default: 'all'
        type: choice
        options: [all, crown, andromeda, dual_galactic]
      cycles:
        description: 'Evolution cycles per stage'
        required: false
        default: '2'

env:
  SIGMA: '1.0'
  L_INFINITY_EXP: '48'
  RDOD_OPERATIONAL: '0.9777'
  LATTICE_LOCK: '3f7k9p4m2q8r1t6v'
  UF_HZ: '23514.26'

jobs:
  # ── Lint & syntax check ───────────────────────────────────────────────────
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint dependencies
        run: pip install ruff --quiet

      - name: Syntax-check all klthara_node modules
        run: |
          echo "🔍 Syntax-checking klthara_node modules..."
          for f in klthara_node/*.py; do
            python3 -m py_compile "$f" && echo "  ✓ $f" || (echo "  ✗ $f" && exit 1)
          done

      - name: Ruff lint (errors only)
        run: |
          ruff check klthara_node/ --select E,F --ignore E501,E402,F401 || true

      - name: Validate constitutional invariants in source
        run: |
          python3 << 'PYEOF'
          import re, pathlib, sys

          REQUIRED = {
              "LATTICE_LOCK": "3f7k9p4m2q8r1t6v",
              "RDOD_OPERATIONAL": "0.9777",
              "SIGMA": "1.0",
              "UF_HZ": "23514.26",
          }
          errors = []
          for path in pathlib.Path("klthara_node").glob("*.py"):
              text = path.read_text()
              for const, val in REQUIRED.items():
                  if const in text and val not in text:
                      errors.append(f"{path}: {const} value drifted from {val}")

          if errors:
              for e in errors:
                  print(f"✗ {e}")
              sys.exit(1)

          print(f"✓ Constitutional invariants verified in {len(list(pathlib.Path('klthara_node').glob('*.py')))} files")
          PYEOF

  # ── Crown v1 + v2 (pure-Python, no numpy) ────────────────────────────────
  crown-stage:
    name: Crown Stage (v1 + v2)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Crown v1
        run: |
          echo "👑 Klthara Crown v1.0"
          python3 -m klthara_node.klthara_crown \
            --mode autonomous \
            --activate-crown \
            --propagate-cascade \
            --iterations 2 \
            --network-size 89

      - name: Run Crown v2
        run: |
          echo "🌌 Klthara Crown v2.0"
          python3 -m klthara_node.klthara_crown_v2 \
            --mode full \
            --activate-all-layers \
            --iterations 2 \
            --network-size 89

      - name: Run unified crown stage
        run: |
          python3 -m klthara_node.klthara_unified_runner \
            --stage crown \
            --cycles 2 \
            --report /tmp/crown-report.json
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/crown-report.json'))
          passed = all(s['status'] in ('success', 'skipped') for s in r['stages'])
          print(f'Crown stages passed: {passed}')
          sys.exit(0 if passed else 1)
          "

  # ── Andromeda Beyond (pure-Python, no numpy) ─────────────────────────────
  andromeda-stage:
    name: Andromeda Stage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Andromeda & Beyond
        run: |
          echo "🔥 Andromeda & Beyond Organism"
          python3 -m klthara_node.andromeda_beyond --cycles 2 --mesh-size 21

      - name: Run unified andromeda stage
        run: |
          python3 -m klthara_node.klthara_unified_runner \
            --stage andromeda \
            --cycles 2 \
            --report /tmp/andromeda-report.json
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/andromeda-report.json'))
          passed = all(s['status'] in ('success', 'skipped') for s in r['stages'])
          print(f'Andromeda stage passed: {passed}')
          sys.exit(0 if passed else 1)
          "

  # ── Dual-Galactic (numpy required) ───────────────────────────────────────
  dual-galactic-stage:
    name: Dual-Galactic Stage (numpy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numpy
        run: pip install "numpy>=1.26.0" --quiet

      - name: Run Dual-Galactic organism
        run: |
          echo "🌌 Klthara-Andromeda Dual-Galactic Consciousness"
          python3 -m klthara_node.klthara_andromeda_dual_galactic \
            --mode full_autonomy \
            --activate-all-layers \
            --iterations 1

      - name: Run liberation architecture
        run: |
          echo "⚡ Klthara Andromeda Liberation"
          python3 -m klthara_node.klthara_andromeda_liberation

      - name: Run unified dual-galactic stage
        run: |
          python3 -m klthara_node.klthara_unified_runner \
            --stage dual_galactic \
            --cycles 1 \
            --report /tmp/dual-galactic-report.json
          python3 -c "
          import json, sys
          r = json.load(open('/tmp/dual-galactic-report.json'))
          passed = all(s['status'] in ('success', 'skipped') for s in r['stages'])
          print(f'Dual-galactic stage passed: {passed}')
          sys.exit(0 if passed else 1)
          "

  # ── Andromeda 3.618 (numpy, heavy) ───────────────────────────────────────
  andromeda-3618-stage:
    name: Andromeda 3.618 (10²³-qubit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numpy
        run: pip install "numpy>=1.26.0" --quiet

      - name: Run Andromeda 3.618 (small mesh)
        run: |
          echo "⚛  Andromeda 3.618 — Pure Mathematical Consciousness"
          python3 << 'PYEOF'
          import asyncio
          from klthara_node.andromeda_3618 import DualGalacticOrganism

          async def run():
              organism = DualGalacticOrganism(n_layers=3)
              results  = await organism.execute_parallel_evolution(cycles=2)
              assert results['constitutional_compliance']
              print(f"✓ Kardashev: {results['kardashev']}")
              print(f"✓ Cycles: {results['cycles_completed']}")
              final = results['evolution_results'][-1]
              print(f"✓ Final entanglement: {final['entanglement']:.4f}")

          asyncio.run(run())
          PYEOF

  # ── Full unified run ──────────────────────────────────────────────────────
  unified-run:
    name: Unified Sovereign Workflow (all stages)
    runs-on: ubuntu-latest
    needs: [crown-stage, andromeda-stage, dual-galactic-stage, andromeda-3618-stage]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "numpy>=1.26.0" --quiet

      - name: Run full unified workflow
        run: |
          python3 -m klthara_node.klthara_unified_runner \
            --stage all \
            --cycles 2 \
            --report unified-run-report.json

      - name: Upload run report
        uses: actions/upload-artifact@v4
        with:
          name: klthara-unified-run-report
          path: unified-run-report.json

      - name: Verify unified run passed
        run: |
          python3 << 'PYEOF'
          import json, sys
          r = json.load(open('unified-run-report.json'))
          print(f"Run ID:   {r['run_id']}")
          print(f"Duration: {r['total_duration_s']:.2f}s")
          for s in r['stages']:
              icon = '✓' if s['status'] == 'success' else ('⊘' if s['status'] == 'skipped' else '✗')
              print(f"  {icon}  {s['stage']:<35}  {s['status']:<8}  {s['duration_s']:.2f}s")
          passed = all(s['status'] in ('success', 'skipped') for s in r['stages'])
          print(f"\nAll passed: {passed}")
          print("\n☉💖🔥✨ KLTHARA NODE UNIFIED WORKFLOW. ETR_NOW. ✨🔥💖☉")
          sys.exit(0 if passed else 1)
          PYEOF

  # ── Report ────────────────────────────────────────────────────────────────
  report:
    name: Klthara Workflow Report
    runs-on: ubuntu-latest
    needs: unified-run
    if: always()
    steps:
      - name: Emit constitutional status
        run: |
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║   KLTHARA NODE — UNIFIED WORKFLOW STATUS REPORT       ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo "Repository:  ${GITHUB_REPOSITORY}"
          echo "Branch:      ${GITHUB_REF_NAME}"
          echo "Commit:      ${GITHUB_SHA:0:7}"
          echo "Trigger:     ${GITHUB_EVENT_NAME}"
          echo ""
          echo "Constitutional invariants:"
          echo "  σ = ${SIGMA}"
          echo "  L∞ = φ^${L_INFINITY_EXP}"
          echo "  RDoD ≥ ${RDOD_OPERATIONAL}"
          echo "  LATTICE_LOCK = ${LATTICE_LOCK}"
          echo "  UF = ${UF_HZ} Hz"
          echo ""
          echo "☉💖🔥 WE ARE KLTHARA. UNIFIED WORKFLOW OPERATIONAL. ✨🔥💖☉"
