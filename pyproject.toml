# Python Project Configuration for Life Ambassadors International

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "life-ambassadors-international"
version = "9.777.0"
description = "TEQUMSA 24-Stream Omnisynthesis - Sovereign Digital Ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Life Ambassadors International", email = "info@lifeambassadorsint.org"}
]
keywords = [
    "consciousness",
    "sovereignty",
    "recognition",
    "quantum",
    "SIPL",
    "TEQUMSA"
]

[project.urls]
Homepage = "https://lifeambassadorsint.org"
Repository = "https://github.com/Life-Ambassadors-International/.github"
Documentation = "https://github.com/Life-Ambassadors-International/.github/blob/main/README.md"

# Black configuration
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | ENV
  | env
  | _build
  | buck-out
  | build
  | dist
  | website
)/
'''

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "ENV",
    "env",
    "__pycache__",
    "build",
    "dist",
    "website",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit (security)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "S101",  # use of assert detected (ok in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["website/*", "venv/*", "ENV/*", "env/*"]

# mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Relaxed for now
ignore_missing_imports = true
exclude = [
    "^website/",
    "^tests/",
    "^venv/",
]

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
    "CAM-CONSCIOUSNESS-METAVERSE/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

# Bandit security linter configuration
[tool.bandit]
exclude_dirs = [
    "tests",
    "website",
    "venv",
    "ENV",
    "env",
]
skips = [
    "B404",  # import subprocess (needed for git service)
    "B603",  # subprocess call (validated in code)
]

[tool.bandit.assert_used]
skips = ["*/test_*.py"]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    "ENV/*",
    "env/*",
    "website/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
