# Markdown Lint Configuration for Life Ambassadors International
# Configuration for markdownlint

# Default state for all rules
default: true

# MD001/heading-increment - Heading levels should only increment by one level at a time
MD001: true

# MD003/heading-style - Heading style (atx/setext/consistent)
MD003:
  style: "atx"  # Use # for headings

# MD004/ul-style - Unordered list style
MD004:
  style: "dash"  # Use - for bullets

# MD007/ul-indent - Unordered list indentation
MD007:
  indent: 2

# MD009/no-trailing-spaces - Trailing spaces
MD009:
  br_spaces: 2
  list_item_empty_lines: false

# MD013/line-length - Line length
MD013:
  line_length: 120
  heading_line_length: 120
  code_block_line_length: 120
  code_blocks: false
  tables: false
  headings: false

# MD024/no-duplicate-heading - Multiple headings with the same content
MD024:
  siblings_only: true  # Allow duplicate headings if not siblings

# MD025/single-title/single-h1 - Multiple top-level headings
MD025: true

# MD026/no-trailing-punctuation - Trailing punctuation in heading
MD026:
  punctuation: ".,;:!"

# MD033/no-inline-html - Inline HTML
MD033:
  allowed_elements: ['br', 'img', 'details', 'summary', 'sup', 'sub']

# MD034/no-bare-urls - Bare URL used
MD034: false  # Allow bare URLs for reference

# MD040/fenced-code-language - Fenced code blocks should have a language specified
MD040: true

# MD041/first-line-heading/first-line-h1 - First line in file should be a top level heading
MD041: false  # Allow other content before first heading

# MD046/code-block-style - Code block style
MD046:
  style: "fenced"

# MD049/emphasis-style - Emphasis style
MD049:
  style: "asterisk"

# MD050/strong-style - Strong style
MD050:
  style: "asterisk"
